<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homing Star · 音效试听库</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#11191d;color:#e0e9e8}body{margin:0}header,main{max-width:1360px;margin:auto;padding:24px}header{padding-bottom:12px}h1{margin:0;font-size:27px}p{color:#a6b9bd;margin:8px 0}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#1d2b30;padding:12px 20px;border-radius:8px}.stat b{font-size:24px;margin-right:8px;color:#87ddc0}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;color:inherit;background:#1d2b30;border:1px solid #395057;border-radius:6px;padding:8px 12px}input{flex:1;min-width:240px}button{cursor:pointer}button:hover{background:#31534f}a{color:#87ddc0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #2a3b40;text-align:left;padding:12px 8px;vertical-align:top}th{color:#a6b9bd}.sub{font-size:12px;color:#8fa8af;overflow-wrap:anywhere}.name{font-weight:600}.playing{background:#193b35}.badge{color:#b8e4d6}.paging{display:flex;align-items:center;gap:14px;padding:14px 0}.wrap{overflow:auto}footer{position:sticky;bottom:0;background:#19272cf5;border-top:1px solid #395057;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}audio{width:min(500px,100%)}#now{flex:1;min-width:200px}#message{color:#ecb38b}label{white-space:nowrap}.links{float:right}
</style>
<header><span class="links"><a href="catalog.csv">CSV 清单</a> · <a href="catalog.json">JSON</a></span><h1>Homing Star · 音效试听库</h1><p>只收录项目内音频。点击播放，按动作或接入状态筛选。</p><div class="stats" id="stats"></div><div class="filters"><input id="q" aria-label="搜索" placeholder="搜索名称、类别、路径、引用代码…"><select id="scope" aria-label="范围"><option value="">全部范围</option></select><select id="group" aria-label="来源分类"><option value="">全部来源分类</option></select><select id="status" aria-label="接入状态"><option value="">全部接入状态</option></select><select id="format" aria-label="格式"><option value="WAV">WAV</option><option value="">全部格式</option><option value="MP3">MP3</option></select><label><input id="duplicates" type="checkbox" style="min-width:0"> 仅重复副本</label></div><p class="sub">接入状态基于正式资源路径的静态检索；未检出不代表确认未使用。Godot .res 内嵌音频不属于 WAV。</p></header>
<main><div class="paging"><button id="prev">上一页</button><span id="count"></span><button id="next">下一页</button></div><div class="wrap"><table><thead><tr><th>试听</th><th style="width:42%">音效 / 路径</th><th>来源 / 类别</th><th>时长 / 规格</th><th>接入状态 / 代码位置</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<footer><button id="stop">停止</button><button id="nextSound">下一条</button><label><input id="auto" type="checkbox" style="min-width:0"> 连续试听</label><select id="mix" aria-label="试听音量"><option value="aligned">响度对齐</option><option value="raw">原始音量</option></select><div id="now">选择一条音效</div><audio id="player" controls preload="none"></audio><div id="message"></div></footer>
<script>
const data=__CATALOG__;const $=s=>document.querySelector(s);let filtered=[],page=0,current=-1;const pageSize=60;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#stats').innerHTML=[['项目 WAV',data.summary.wav],['正式 WAV',data.summary.runtime_wav],['其他项目 WAV',data.summary.wav-data.summary.runtime_wav],['内容重复组',data.summary.duplicate_groups]].map(([label,n])=>`<div class="stat"><b>${n}</b>${label}</div>`).join('');
for(const key of ['scope','group','status'])for(const value of [...new Set(data.items.map(r=>r[key]))].sort()){$('#'+key).add(new Option(value,value));}
function filter(){const q=$('#q').value.trim().toLowerCase();filtered=data.items.filter(r=>(!q||[r.name,r.path,r.category,...r.references].join(' ').toLowerCase().includes(q))&&['scope','group','status','format'].every(k=>!$('#'+k).value||r[k]===$('#'+k).value)&&(!$('#duplicates').checked||r.copies>1));page=0;render();}
function render(){const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.max(0,Math.min(page,pages-1));$('#count').textContent=`${filtered.length} 条 · ${page+1} / ${pages} 页`;$('#prev').disabled=page===0;$('#next').disabled=page===pages-1;
$('#rows').innerHTML=filtered.slice(page*pageSize,(page+1)*pageSize).map(r=>`<tr class="${r.id===current?'playing':''}"><td><button data-play="${r.id}" aria-label="播放 ${esc(r.name)}">▶ 播放</button></td><td><div class="name">${esc(r.name)} ${r.copies>1?`<span class="badge">×${r.copies} 相同内容</span>`:''}</div><div class="sub">${esc(r.path)}</div></td><td>${esc(r.scope)} · ${esc(r.group)}<div class="sub">${esc(r.category)}</div></td><td>${r.duration===null?'—':r.duration.toFixed(2)+' 秒'}<div class="sub">${r.format} ${r.rate?r.rate+' Hz · '+r.channels+' 声道 · '+r.bits+' bit':''}<br>${(r.size/1024).toFixed(1)} KB</div></td><td>${esc(r.status)}<div class="sub">${r.references.map(esc).join('<br>')}${r.imported.length?'<br>'+r.imported.map(esc).join('<br>'):''}</div></td></tr>`).join('');}
let audioContext,gainNode;
function applyMix(){if(location.protocol==="file:"){$("#now").textContent=data.items[current].name+" · 本地文件原始音量";$("#message").textContent="响度对齐请使用 http://127.0.0.1:8774/ 试听服务。";return;}if(!audioContext){audioContext=new AudioContext();const source=audioContext.createMediaElementSource($("#player"));gainNode=audioContext.createGain();source.connect(gainNode);gainNode.connect(audioContext.destination);}audioContext.resume();const row=data.items[current];const db=$("#mix").value==="aligned"?(row?.audition_gain_db??0):0;gainNode.gain.setValueAtTime(10**(db/20),audioContext.currentTime);if(row)$("#now").textContent=row.name+($("#mix").value==="raw"?" · 原始音量":row.audition_gain_db===null?" · 未测量，原始音量":" · 基础响度对齐（不含实战层级）");}
$("#mix").onchange=()=>{if(current>=0)applyMix();};
function play(id){const r=data.items[id];current=id;$('#message').textContent='';$('#now').textContent=r.name;const player=$('#player');player.src=location.protocol==='file:'?r.uri:'/audio/'+id;applyMix();player.play().catch(e=>{$('#message').textContent='无法播放：'+e.message+'。本地文件受限时请启动 README 中的预览服务。';});render();}
function nextSound(){const index=filtered.findIndex(r=>r.id===current);if(index+1<filtered.length){const next=index+1;page=Math.floor(next/pageSize);play(filtered[next].id);}}
$('#rows').addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(b)play(Number(b.dataset.play));});$('#q').oninput=filter;for(const id of ['scope','group','status','format','duplicates'])$('#'+id).onchange=filter;
$('#prev').onclick=()=>{page--;render();};$('#next').onclick=()=>{page++;render();};$('#nextSound').onclick=nextSound;$('#stop').onclick=()=>{$('#player').pause();$('#player').currentTime=0;};$('#player').onended=()=>{if($('#auto').checked)nextSound();};$('#player').onerror=()=>{$('#message').textContent='文件无法播放或格式不受浏览器支持，请检查路径或使用本地预览服务。';};filter();
</script></html>
